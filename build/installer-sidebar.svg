<svg xmlns="http://www.w3.org/2000/svg" width="164" height="314" viewBox="0 0 164 314">
  <!-- NSIS welcome/finish page image (164x314); rendered to build/installerSidebar.bmp by npm run icons. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="164" y2="314" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6a2fe0"/>
      <stop offset="0.5" stop-color="#ad29d3"/>
      <stop offset="1" stop-color="#ef4790"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30" cy="20" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="104" x2="0" y2="166" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="164" height="314" fill="url(#bg)"/>
  <rect width="164" height="314" fill="url(#sheen)"/>

  <!-- Soft zoom rings around the glyph -->
  <circle cx="82" cy="136" r="74" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="2"/>
  <circle cx="82" cy="136" r="104" fill="none" stroke="#fff" stroke-opacity="0.05" stroke-width="2"/>

  <!-- Screen + cursor glyph (same drawing as build/icon.svg, without the tile) -->
  <rect x="36" y="104" width="92" height="64" rx="10" fill="url(#glass)" stroke="#fff" stroke-width="7"/>
  <circle cx="55" cy="122" r="7" fill="#fff"/>
  <circle cx="55" cy="122" r="4.6" fill="#ff3d6e"/>
  <g transform="translate(80 126) scale(0.47)" filter="url(#shadow)">
    <path d="M0 0 V108 L27 82 L44 122 L62 114 L45 75 H82 Z" fill="#2b1061" stroke="#2b1061" stroke-width="20" stroke-linejoin="round"/>
    <path d="M0 0 V108 L27 82 L44 122 L62 114 L45 75 H82 Z" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
