# Builds the Windows installer and puts it, with the update metadata, in a DRAFT GitHub release
# (docs/RELEASING.md, docs/design/auto-update.md §4). Drafts are invisible to Flown: nothing reaches
# users until someone opens the draft on GitHub and presses "Publish release".
#
# Run it by hand: Actions › Release › Run workflow. It stops before building when the version in
# package.json already has a release (draft or published) or a tag, or docs/RELEASE-NOTES.md has no
# section for it.
#
# Only the jobs that run no npm package and no build hold a token that can write to the
# repository: the build job, which runs every dependency's install scripts and build code, can
# only read it, so a bad dependency cannot publish a release, change a published one or push.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Write access only so the check sees drafts too.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Version
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version in package.json is not x.y.z."
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release v$version already exists. Raise the version in package.json first."
            exit 1
          fi
          # A deleted release keeps its tag, and a new draft would be attached to that old commit.
          tags=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$version" --jq "map(select(.ref == \"refs/tags/v$version\")) | length")
          if [ "$tags" != 0 ]; then
            echo "::error::A tag v$version already exists. Raise the version in package.json first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Notes
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release/notes.md"

      # The toolchain native/README.md and docs/BUILDING.md list: the Windows helpers are
      # cross-compiled with MinGW-w64; Wine runs rcedit (icons and file properties of the exes).
      - name: Toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 cmake clang libclang-dev wine wine32 wine64
          rustup toolchain install 1.97.0 --profile minimal --target x86_64-pc-windows-gnu
          rustup default 1.97.0

      - run: npm ci

      - name: Build and check the installer
        env:
          # Release builds need both native helpers and the checked notices (scripts/predist.mjs).
          SSW_REQUIRE_NATIVE: '1'
        run: |
          npm run dist:win
          cp "dist/Flown-Setup-$VERSION.exe" dist/latest.yml "$RUNNER_TEMP/release/"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 1

  draft:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No checkout, no npm, no build: this job only uploads what the build made.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Flown $VERSION" --notes-file release/notes.md \
            "release/Flown-Setup-$VERSION.exe" release/latest.yml
          {
            echo "### Flown $VERSION: draft release made"
            echo
            echo "Open it under Releases, try the installer, then press **Publish release**."
            echo
            echo '```'
            sha256sum "release/Flown-Setup-$VERSION.exe"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
