[package]
name = "ssw-capture"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Screen Studio for Windows capture helper: Windows.Graphics.Capture without the cursor, encoded to H.264 MP4 with Media Foundation."
publish = false

[[bin]]
name = "ssw-capture"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
  "Foundation",
  "Foundation_Metadata",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Security_Authorization_AppCapabilityAccess",
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# A panic prints a JSON error (see main.rs) and aborts; there is nothing to unwind into.
panic = "abort"
